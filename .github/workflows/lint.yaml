name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  rumdl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: rvben/rumdl@bb84a49a85625b31ecf6c3e58b7bca7c75fbfefb  # v0.2.77
        with:
          version: 0.2.77
